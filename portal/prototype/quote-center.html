<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASCEND · Hızlı Fiyat Al</title><link rel="stylesheet" href="portal-design.css"><link rel="stylesheet" href="portal-fonts.css"><link rel="stylesheet" href="portal-theme.css"><script src="portal-theme.js"></script><style>main{padding:24px;max-width:1180px}header{display:flex;align-items:center;gap:24px}header img{height:48px}.card{padding:24px;margin:20px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.field{display:grid;gap:6px}input,select,textarea,button{padding:10px}textarea{width:100%;min-height:260px}#status{padding:12px;white-space:pre-wrap}.draft{padding:18px;margin:14px 0;border:1px solid var(--border);border-radius:10px}button{cursor:pointer}</style></head><body><header><img src="ascend-logo-light.svg" alt="ASCEND Lojistik"><a href="index.html">Ana Sayfa</a><a href="02_LOJISTIK_PORTAL_BRANDED_v14.html?section=companies">Firma Kartları</a></header><main><h1>Hızlı Fiyat Al</h1><p>Talep ülkesi ve taşıma birimine göre her acente için ayrı e-posta taslağı hazırlanır. Gönderim yönetici kontrolü gerektirir.</p><p id="status" role="status" aria-live="polite"></p><form id="quoteForm" class="card" novalidate><h2>Yeni fiyat talebi</h2><p>Tüm alanlar zorunludur.</p><div id="fields" class="fields"></div><button class="primary" type="submit">Talebi kaydet ve taslakları hazırla</button></form><section class="card"><h2>Talepler ve acente taslakları</h2><button id="refresh" onclick="render().catch(e=>document.getElementById('status').textContent=e.message)">Listeyi yenile</button><div id="requests"></div></section></main><script>
const countries=["Afganistan","Almanya","Amerika Birleşik Devletleri","Angola","Antarktika","Arjantin","Arnavutluk","Avustralya","Avusturya","Azerbaycan","Bahamalar","Bangladeş","Batı Sahra","Belçika","Belize","Benin","Beyaz Rusya","Bhutan","Birleşik Arap Emirlikleri","Birleşik Krallık","Bolivya","Bosna-Hersek","Botsvana","Brezilya","Brunei","Bulgaristan","Burkina Faso","Burundi","Cezayir","Cibuti","Çad","Çek Cumhuriyeti","Çin Cumhuriyeti","Çin Halk Cumhuriyeti","Danimarka","Demokratik Kongo Cumhuriyeti","Doğu Timor","Dominik Cumhuriyeti","Ekvador","Ekvator Ginesi","El Salvador","Endonezya","Eritre","Ermenistan","Estonya","Esvatini","Etiyopya","Falkland Adaları","Fas","Fiji","Fildişi Sahili","Filipinler","Filistin","Finlandiya","Fransa","Fransız Güney ve Antarktika Toprakları","Gabon","Gambiya","Gana","Gine","Gine-Bissau","Grönland","Guatemala","Guyana","Güney Afrika Cumhuriyeti","Güney Kore","Güney Sudan","Gürcistan","Haiti","Hırvatistan","Hindistan","Hollanda","Honduras","Irak","İran","İrlanda","İspanya","İsrail","İsveç","İsviçre","İtalya","İzlanda","Jamaika","Japonya","Kamboçya","Kamerun","Kanada","Karadağ","Katar","Kazakistan","Kenya","Kıbrıs Cumhuriyeti","Kırgızistan","Kolombiya","Kongo Cumhuriyeti","Kosova","Kosta Rika","Kuveyt","Kuzey Kıbrıs Türk Cumhuriyeti","Kuzey Kore","Kuzey Makedonya","Küba","Laos","Lesotho","Letonya","Liberya","Libya","Litvanya","Lübnan","Lüksemburg","Macaristan","Madagaskar","Malavi","Malezya","Mali","Meksika","Mısır","Moğolistan","Moldova","Moritanya","Mozambik","Myanmar","Namibya","Nepal","Nijer","Nijerya","Nikaragua","Norveç","Orta Afrika Cumhuriyeti","Özbekistan","Pakistan","Panama","Papua Yeni Gine","Paraguay","Peru","Polonya","Portekiz","Porto Riko","Romanya","Ruanda","Rusya","Senegal","Sırbistan","Sierra Leone","Slovakya","Slovenya","Solomon Adaları","Somali","Somaliland","Sri Lanka","Sudan","Surinam","Suriye","Suudi Arabistan","Şili","Tacikistan","Tanzanya","Tayland","Togo","Trinidad ve Tobago","Tunus","Türkiye","Türkmenistan","Uganda","Ukrayna","Umman","Uruguay","Ürdün","Vanuatu","Venezuela","Vietnam","Yemen","Yeni Kaledonya","Yeni Zelanda","Yunanistan","Zambiya","Zimbabve"];const modes=['Hava','Kara','Deniz','Demiryolu'];const definition=[['company','Firma adı'],['person','Yetkili kişi'],['email','E-posta','email'],['phone','Telefon','tel'],['direction','İşlem yönü',['İthalat','İhracat']],['mode','Taşıma türü',modes],['originCountry','Çıkış ülkesi',countries],['originCity','Çıkış şehri'],['originAddress','Yükleme adresi'],['destinationCountry','Varış ülkesi',countries],['destinationCity','Varış şehri'],['destinationAddress','Teslim adresi'],['goods','Eşya açıklaması'],['packages','Toplam kap','number'],['gross','Brüt kg','number'],['net','Net kg','number'],['volume','Hacim m³','number'],['dimensions','Kap ölçüleri (en × boy × yükseklik, cm)'],['readyDate','Yükün hazır olacağı tarih','date'],['incoterm','Teslim şekli',['EXW','FCA','FOB','CFR','CIF','CPT','CIP','DAP','DPU','DDP']]];const $=id=>document.getElementById(id);const admin=window.portalBootstrap?.user.role==='Yönetici';
for(const [key,label,type] of definition){const wrapper=document.createElement('label');wrapper.className='field';wrapper.textContent=label+' *';const input=document.createElement(Array.isArray(type)?'select':'input');input.id=key;input.name=key;input.required=true;if(Array.isArray(type)){input.add(new Option('Seçin',''));for(const value of type)input.add(new Option(value,value));}else{input.type=type||'text';if(type==='number'){input.min='0.01';input.step=key==='packages'?'1':'any';}}wrapper.append(input);$('fields').append(wrapper);}
async function api(path,body){const r=await fetch('/api/tenant/quotes'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
async function render(){const rows=await api('');$('requests').replaceChildren();for(const r of rows){const section=document.createElement('section');section.className='draft';const title=document.createElement('h3');title.textContent=r.id+' · '+r.body.originCountry+' → '+r.body.destinationCountry+' · '+r.body.mode;section.append(title);if(r.status==='needs-carrier'){const warning=document.createElement('p');warning.textContent=(r.body.direction==='İthalat'?r.body.originCountry:r.body.destinationCountry)+' / '+r.body.mode+' için e-posta adresli temsilci bulunamadı. Firma Kartları bölümünden acente/taşıyıcı ve ilgili birimi ekleyin.';section.append(warning);}const retry=document.createElement('button');retry.textContent='Acente eşleşmesini yenile';retry.onclick=async()=>{try{await api('/prepare',{id:r.id});await render();}catch(e){$('status').textContent=e.message;}};section.append(retry);for(const d of r.drafts){const box=document.createElement('div');box.className='draft';const label=document.createElement('p');label.textContent='Acente: '+d.carrier_id+' · Kime: '+d.body.to.join(', ')+' · CC: '+d.body.cc.join(', ');const subject=document.createElement('input');subject.value=d.body.subject;subject.setAttribute('aria-label','E-posta konusu');const body=document.createElement('textarea');body.className='resize-none';body.value=d.body.text;body.setAttribute('aria-label','E-posta taslağı');subject.readOnly=!admin;body.readOnly=!admin;box.append(label,subject,body);if(admin){const approve=document.createElement('button');approve.textContent=d.status==='approved'?'Onaylandı · Gönderim hizmeti bekleniyor':'Kontrol ettim — gönderim kuyruğuna al';approve.disabled=d.status==='approved';approve.onclick=async()=>{try{await api('/approve',{id:d.id,subject:subject.value,text:body.value,reviewed:true});$('status').textContent='Onaylandı. SMTP bağlantısı olmadığı için henüz gönderilmedi.';await render();}catch(e){$('status').textContent=e.message;}};box.append(approve);}section.append(box);}$('requests').append(section);}if(!rows.length)$('requests').textContent='Henüz fiyat talebi yok.';}
$('quoteForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));for(const [key,label] of definition)if(!String(data[key]).trim()){$('status').textContent=label+' zorunludur.';$(key).focus();return;}const button=e.currentTarget.querySelector('button');button.disabled=true;try{const result=await api('',data);$('status').textContent=result.status==='needs-carrier'?'Talep kaydedildi. '+result.missingCountry+' / '+result.mode+' için acente eklenmeli.':result.carrierCount+' ayrı acente taslağı hazırlandı. Gönderilmedi.';await render();}catch(error){$('status').textContent=error.message;}finally{button.disabled=false;}};$('refresh').onclick=()=>render().catch(e=>$('status').textContent=e.message);render().catch(e=>$('status').textContent=e.message);
</script></body></html>
