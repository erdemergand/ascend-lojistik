</style><link rel="stylesheet" href="portal-fonts.css"><link rel="stylesheet" href="portal-theme.css"><script src="portal-theme.js"></script></head><body><header><img src="ascend_logo_correct.png" alt="Ascend Lojistik"><div><strong id="who"></strong><div class="muted" id="identity"></div></div><a href="index.html">Ana Sayfa</a></header><div class="notice">Demo çalışma alanı · Tüm şirketler ve işlemler kurgusaldır. Değişiklikler yalnız bu demo ekranında saklanır.</div><div class="shell"><aside id="menu"></aside><main id="screen"></main></div><script src="shared-portal.js"></script><script>
const screen=document.getElementById('screen');
const staff=new URLSearchParams(location.search).get('role')==='staff';
who.textContent=staff?'Operasyon Ekibi':'Anadolu Dış Ticaret';identity.textContent=staff?'Demo Personel · Operasyon':'Demo Müşteri · Firma Yetkilisi';
const key='ascend_workspace_demo_'+(staff?'staff':'customer');
const seed=[{id:'ASC-DEMO-0001',module:'Lojistik',sender:'Avrupa Tedarik',receiver:'Anadolu Dış Ticaret',route:'Almanya → Türkiye',date:'2026-09-14',status:'Yolda',plate:'34 DEMO 01',bill:'DEMO-BL-001',container:'',packages:12,weight:2400,currency:'EUR',sale:2250,paid:1000},{id:'ASC-DEMO-0002',module:'Lojistik',sender:'Anadolu Dış Ticaret',receiver:'Avrupa Tedarik',route:'Türkiye → Almanya',date:'2026-09-12',status:'Tamamlandı',plate:'34 DEMO 02',bill:'',container:'DEMO-CONT-002',packages:8,weight:1800,currency:'USD',sale:1800,paid:1800},{id:'ASC-DEMO-0003',module:'NCTS',sender:'Avrupa Tedarik',receiver:'Anadolu Dış Ticaret',route:'Kapıkule → Erenköy',date:'2026-09-14',status:'Hazırlanıyor',plate:'34 DEMO 03',packages:20,weight:980}];
let demoCompanies=JSON.parse(sessionStorage.getItem('ascend_demo_staff_companies')||'[]');
let records=JSON.parse(sessionStorage.getItem(key)||'null')||seed;let active='Genel Bakış';
const moduleName=new URLSearchParams(location.search).get('module')||'home';
const pages=moduleName==='logistics'?['Lojistik Dosyaları','Bildirimler',...(staff?[]:['Lojistik Finans','Carim'])]:moduleName==='ncts'?['NCTS Dosyaları']:[];
function moduleLink(module){if(module==='logistics')return '02_LOJISTIK_PORTAL_BRANDED_v14.html?view='+(staff?'staff':'customer');if(module==='ncts')return '01_NCTS_BRANDED_v15.html?view='+(staff?'staff':'customer');return 'role-preview.html?role='+(staff?'staff':'customer')+'&module='+module;}
function home(){
 menu.replaceChildren();shell('Operasyon Portalı','Çalışma alanınızı seçin. Lojistik ve NCTS dosyaları ayrı modüllerde takip edilir.');
 if(staff){menu.append(button('Firma Kartları',()=>{nav('Firma Kartları');}));}
 const grid=el('div',undefined,'detail-grid');screen.append(grid);
 for(const [code,title,description] of [['logistics','Lojistik Operasyon','Sevkiyat dosyaları · Bildirimler · Lojistik Finans · Cari'],['ncts','NCTS / T1','Transit dosyaları · Yük ve gümrük bilgileri']]){const c=el('section',undefined,'card');c.append(el('h2',title),el('p',description,'muted'));const link=el('a','Çalışma Alanını Aç →');link.href=moduleLink(code);c.append(link);grid.append(c);}
}

function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function button(text,fn){const b=el('button',text);b.onclick=fn;return b;}
function money(v,c){return Number(v).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+c;}
function table(headers,rows){const t=el('table'),head=el('thead'),tr=el('tr');headers.forEach(h=>tr.append(el('th',h)));head.append(tr);t.append(head);const body=el('tbody');for(const cells of rows){const r=el('tr');cells.forEach(v=>{const td=el('td');td.append(v instanceof Node?v:document.createTextNode(String(v)));r.append(td)});body.append(r)}if(!rows.length){const r=el('tr'),td=el('td','Bu filtreye uygun kayıt bulunamadı.');td.colSpan=headers.length;r.append(td);body.append(r)}t.append(body);return t;}
function shell(title,sub){screen.replaceChildren();const h=el('div',undefined,'banner'),left=el('div');left.append(el('span',staff?'OPERASYON ÇALIŞMA ALANI':'MÜŞTERİ ÇALIŞMA ALANI','eyebrow'),el('h1',title),el('p',sub,'muted'));h.append(left);screen.append(h);return h;}
function card(title){const c=el('section',undefined,'card');if(title)c.append(el('h2',title));screen.append(c);return c;}
function nav(page){if(!pages.includes(page)&&!(staff&&moduleName==='home'&&page==='Firma Kartları'))return;active=page;menu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.textContent===page));shell(page,moduleName==='ncts'?'NCTS / T1 · Transit çalışma alanı':moduleName==='logistics'?'Lojistik Operasyon · Sevkiyat çalışma alanı':'Ortak Firma Kartları');
if(staff&&['Lojistik Dosyaları','NCTS Dosyaları','Firma Kartları'].includes(page))screen.append(button(page==='Firma Kartları'?'+ Yeni Firma Kartı':page==='NCTS Dosyaları'?'+ Yeni NCTS':'+ Yeni Lojistik Dosyası',()=>createRecord(page)));
if(page==='Genel Bakış'){const m=el('div',undefined,'metrics');for(const [title,n] of [['Toplam Dosya',records.length],['Devam Eden',records.filter(r=>r.status!=='Tamamlandı').length],['Tamamlanan',records.filter(r=>r.status==='Tamamlandı').length]]){const box=el('div',title,'metric');box.append(el('strong',n));m.append(box)}screen.append(m);list(records);}
else if(page.includes('Dosya'))list(records.filter(r=>!page.startsWith('NCTS')||r.module==='NCTS').filter(r=>!page.startsWith('Lojistik')||r.module==='Lojistik'));
else if(page==='Firma Kartları'){card('Ortak firma kayıtları').append(table(['Firma','Ülke','Adres'],[['Avrupa Tedarik','Almanya','Demo Strasse 10, Berlin'],['Anadolu Dış Ticaret','Türkiye','Demo Mahallesi, Tuzla, İstanbul'],['Demo Taşıyıcı','Türkiye','Demo Lojistik Caddesi, İstanbul'],...demoCompanies.map(c=>[c.name,c.country,c.address])]));}
else if(page==='Bildirimler'){card('Sevkiyat bildirimleri').append(table(['Dosya','Bildirim','Tarih','İşlem'],records.filter(r=>r.module==='Lojistik').map(r=>[r.id,r.status==='Tamamlandı'?'Varış bildirimi':'Çıkış bildirimi',r.date,button('Görüntüle',()=>detail(r,true))])));}
else if(page.includes('Finans')){card('Navlun satışları').append(table(['Dosya','Firma','Navlun Satış','Tahsil Edilen','Kalan'],records.filter(r=>r.module==='Lojistik').map(r=>[r.id,r.receiver,money(r.sale,r.currency),money(r.paid,r.currency),money(r.sale-r.paid,r.currency)])));}
else{card('Döviz bazında hesap özeti').append(table(['Döviz','Fatura','Ödeme','Kalan Borç'],['EUR','USD'].map(c=>{const rs=records.filter(r=>r.currency===c);const sale=rs.reduce((a,r)=>a+r.sale,0),paid=rs.reduce((a,r)=>a+r.paid,0);return[c,money(sale,c),money(paid,c),money(sale-paid,c)]})));card('Fatura ve ödeme hareketleri').append(table(['Tarih','Dosya','İşlem','Tutar'],records.filter(r=>r.module==='Lojistik').flatMap(r=>[[r.date,r.id,'Fatura',money(r.sale,r.currency)],[r.date,r.id,'Ödeme',money(r.paid,r.currency)]])));}}
function list(data){const c=card('Dosya listesi'),filters=el('div',undefined,'filters'),search=el('input');search.placeholder='Dosya, firma veya plaka ara';search.setAttribute('aria-label','Dosya ara');const select=el('select');select.setAttribute('aria-label','Durum');['Tüm durumlar','Hazırlanıyor','Yolda','Tamamlandı'].forEach(x=>select.append(el('option',x)));filters.append(search,select);c.append(filters);const results=el('div');c.append(results);function draw(){const q=search.value.toLocaleLowerCase('tr');results.replaceChildren(table(['Dosya','Modül','Gönderici / Alıcı','Güzergâh','Durum','İşlem'],data.filter(r=>(select.value==='Tüm durumlar'||r.status===select.value)&&[r.id,r.sender,r.receiver,r.plate].join(' ').toLocaleLowerCase('tr').includes(q)).map(r=>[r.id,r.module,r.sender+' / '+r.receiver,r.route,el('span',r.status,'pill'),button(staff?'Aç / Güncelle':'Detayı Gör',()=>detail(r))])))}search.oninput=draw;select.onchange=draw;draw();}
function detail(r,notice=false){if((moduleName==='ncts'&&r.module!=='NCTS')||(moduleName==='logistics'&&r.module!=='Lojistik'))return;shell(notice?'Sevkiyat Bildirimi':r.id,r.module+' · '+r.route);screen.prepend(button('← Listeye dön',()=>nav(active)));const grid=el('div',undefined,'detail-grid');screen.append(grid);function box(title,fields){const c=el('section',undefined,'card');c.append(el('h2',title));fields.forEach(([label,value])=>{const p=el('p');p.append(el('span',label,'muted'),el('strong',value||'—'));c.append(p)});grid.append(c)}box('Firma ve yük bilgileri',[['Gönderici',r.sender],['Alıcı',r.receiver],['Kap',r.packages],['Brüt kilo',r.weight+' kg'],...(staff?[['Acente / Taşıyıcı','Demo Taşıyıcı']]:[])]);box('Sevkiyat bilgileri',[['Durum',r.status],['Yükleme tarihi',r.date],['Plaka',r.plate],['B/L - Konşimento No',r.bill],['Konteyner No',r.container]]);const history=card('İşlem geçmişi');const timeline=el('div',undefined,'timeline');timeline.append(el('p',r.date+' · Dosya oluşturuldu'),el('p',r.status==='Tamamlandı'?'Varış bildirimi hazırlandı':r.status==='Yolda'?'Çıkış bildirimi hazırlandı':'Evrak kontrolü bekleniyor'));history.append(timeline);card('Orijinal evraklar').append(el('p',(r.docs||['Fatura','Çeki Listesi']).join(' · ')));renderDocuments(r);
if(staff&&!notice){const c=card('Operasyon güncelleme'),form=el('form',undefined,'create-grid'),fields={};
for(const [id,label,type] of [['sender','Gönderici','text'],['receiver','Alıcı','text'],['date','Yükleme Tarihi','date'],['packages','Kap','number'],['weight','Brüt Kilo','number'],['plate','Plaka','text'],['bill','B/L - Konşimento No','text'],['container','Konteyner No','text'],['reg','Tescil No','text'],['warehouse','Antrepo / Depo','text'],['warehouseNo','Antrepo / Ambar No','text']]){const wrap=el('label',label),input=el('input');input.type=type;input.value=r[id]||'';if(['sender','receiver','date','packages','weight'].includes(id))input.required=true;fields[id]=input;wrap.append(input);form.append(wrap);}
const docs=el('fieldset');docs.append(el('legend','Orijinal evraklar'));for(const name of ['Fatura','Çeki Listesi','A.TR','EUR.1','Menşe Şahadetnamesi']){const label=el('label',name),check=el('input');check.type='checkbox';check.value=name;check.checked=(r.docs||['Fatura','Çeki Listesi']).includes(name);label.prepend(check);docs.append(label);}form.append(docs);
const save=el('button','Güncellemeyi Kaydet');save.type='submit';form.append(save);form.onsubmit=e=>{e.preventDefault();for(const [id,input] of Object.entries(fields))r[id]=input.value.trim();r.docs=[...docs.querySelectorAll('input:checked')].map(x=>x.value);sessionStorage.setItem(key,JSON.stringify(records));detail(r);};c.append(form);}}
function noticeRecord(r,event){
 if(!staff||r.module!=='Lojistik')return;
 const fields=event==='departure'?['plate','bill','container']:['reg','warehouse','warehouseNo'];
 if(!fields.some(k=>String(r[k]||'').trim())){document.getElementById('noticeMessage').textContent=event==='departure'?'Önce Plaka, B/L veya Konteyner No bilgilerinden en az birini kaydedin.':'Önce Tescil No, Antrepo/Depo veya Antrepo/Ambar No bilgilerinden en az birini kaydedin.';return;}
 if(event==='arrival'&&!r.departure){document.getElementById('noticeMessage').textContent='Önce çıkış bildirimi yapın.';return;}
 if(!r[event])r[event]=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Istanbul'}).format(new Date());r.status=event==='arrival'?'Tamamlandı':'Yolda';sessionStorage.setItem(key,JSON.stringify(records));detail(r);document.getElementById('noticeMessage').textContent='Bildirim kaydedildi; PDF hazır. E-posta bağlantısı olmadığı için mail gönderilmedi.';
}
function renderDocuments(r){
 const c=card('Belgeler ve bildirimler');c.append(button('Son İşlem PDF’sini Görüntüle',()=>viewRecordPdf(r)));
 if(r.module==='Lojistik'){
 if(staff)c.append(button('Çıkış Bildirimi Yap',()=>noticeRecord(r,'departure')),button('Varış Bildirimi Yap',()=>noticeRecord(r,'arrival')));
 if(r.departure)c.append(button('Çıkış Bildirimi PDF',()=>viewRecordPdf(r,'departure')));
 if(r.arrival)c.append(button('Varış Bildirimi PDF',()=>viewRecordPdf(r,'arrival')));
 }const msg=el('p','');msg.id='noticeMessage';msg.setAttribute('role','status');c.append(msg);
}
async function viewRecordPdf(r,event){
 const title=event==='departure'?'ÇIKIŞ BİLDİRİMİ':event==='arrival'?'VARIŞ BİLDİRİMİ':'İŞLEM BİLGİLERİ';
 const rows=[['Dosya',r.id],['Gönderici',r.sender],['Alıcı',r.receiver],['Tarih',event?r[event]:r.date],['Durum',r.status],['Kap / Brüt kilo',r.packages+' / '+r.weight+' kg'],['Plaka',r.plate],['B/L - Konşimento No',r.bill],['Konteyner No',r.container],...(event==='arrival'?[['Tescil No',r.reg],['Antrepo / Depo',r.warehouse],['Antrepo / Ambar No',r.warehouseNo]]:[]),['Orijinal evraklar',(r.docs||['Fatura','Çeki Listesi']).join(', ')]];
 const canvas=document.createElement('canvas');canvas.width=1240;canvas.height=1754;const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,1240,1754);ctx.fillStyle='#302080';ctx.font='bold 32px Arial';ctx.fillText('ASCEND LOJİSTİK',70,90);ctx.fillText(title,70,160);let y=235;
 for(const [label,value] of rows){ctx.fillStyle='#eef0f7';ctx.fillRect(60,y-30,1120,65);ctx.fillStyle='#17243b';ctx.font='20px Arial';ctx.fillText(label,75,y);ctx.fillText(String(value||'—'),440,y,710);y+=76;}
 ctx.font='18px Arial';ctx.fillText('DEMO · Kurgusal işlem belgesi. Resmî beyanname değildir.',70,1650);
 const jpg=Uint8Array.from(atob(canvas.toDataURL('image/jpeg',.95).split(',')[1]),c=>c.charCodeAt(0));const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;const add=v=>{const bytes=typeof v==='string'?enc.encode(v):v;chunks.push(bytes);length+=bytes.length;};add('%PDF-1.4\n');
 const obj=(id,text)=>{offsets[id]=length;add(id+' 0 obj\n'+text+'\nendobj\n');};obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');offsets[4]=length;add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');add(jpg);add('\nendstream\nendobj\n');const stream='q 595 0 0 842 0 0 cm /Im0 Do Q';obj(5,'<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');const xref=length;add('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 const url=URL.createObjectURL(new Blob(chunks,{type:'application/pdf'}));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function createRecord(page){
 if(!staff||(!pages.includes(page)&&!(moduleName==='home'&&page==='Firma Kartları')))return;
 const company=page==='Firma Kartları',ncts=page==='NCTS Dosyaları';
 shell(company?'Yeni Firma Kartı':ncts?'Yeni NCTS Dosyası':'Yeni Lojistik Dosyası','Operasyon kaydı');
 const form=el('form'),grid=el('div',undefined,'create-grid'),fields={};
 function field(id,label,type='text',options){const wrap=el('label',label+' *');const input=el(options?'select':type==='textarea'?'textarea':'input');input.id='create_'+id;input.required=true;if(!options&&type!=='textarea')input.type=type;if(type==='number'){input.min='0';input.step='any';}if(options){const empty=el('option','Seçiniz');empty.value='';input.append(empty);options.forEach(v=>{const o=el('option',v);o.value=v;input.append(o)})}fields[id]=input;wrap.append(input);grid.append(wrap);}
 if(company){field('name','Tam Unvan');field('shortName','Kısa Ad');fields.shortName.required=false;field('country','Ülke');field('address','Açık Adres','textarea');field('email','E-posta','email');field('taxOffice','Vergi Dairesi');field('taxNo','Vergi No');fields.taxOffice.required=fields.taxNo.required=false;}
 else{
 const companies=['Avrupa Tedarik','Anadolu Dış Ticaret',...demoCompanies.map(c=>c.name)];
 field('sender','Gönderici','text',companies);field('receiver','Alıcı','text',companies);field('date','Yükleme / Form Tarihi','date');field('packages','Toplam Kap','number');field('weight','Brüt Kilo','number');field('country','Çıkış Ülkesi');field('plate','Plaka');fields.plate.required=false;
 if(ncts){field('summary','Özet Beyan No');field('summaryDate','Özet Beyan Tarihi','date');field('net','Net Kilo','number');field('departure','Hareket Gümrüğü','text',officialCustoms);field('arrival','Varış Gümrüğü','text',officialCustoms);field('warehouse','Antrepo / Depo');field('value','Eşya Kıymeti','number');field('currency','Eşya Kıymeti Dövizi','text',portalCurrencies);field('tax','Eşyanın Vergi Tutarı (TL)','number');field('invoice','Fatura No');field('invoiceDate','Fatura Tarihi','date');}
 else{field('direction','Yön','text',['İthalat','İhracat']);field('agent','Acente / Taşıyıcı','text',['Demo Taşıyıcı',...demoCompanies.map(c=>c.name)]);field('goods','Eşya Tanımı');field('currency','Döviz','text',portalCurrencies);}
 }
 form.append(grid);const actions=el('div',undefined,'create-actions'),save=el('button','Kaydet');save.type='submit';const cancel=button('Vazgeç',()=>nav(page));cancel.type='button';actions.append(save,cancel);form.append(actions);
 form.onsubmit=e=>{e.preventDefault();if(!staff)return;const values=Object.fromEntries(Object.entries(fields).map(([k,input])=>[k,input.value.trim()]));if(company){demoCompanies.push(values);sessionStorage.setItem('ascend_demo_staff_companies',JSON.stringify(demoCompanies));}else{const next=Math.max(0,...records.map(r=>Number(r.id.split('-').pop())||0))+1;records.push({...values,id:'ASC-DEMO-'+String(next).padStart(4,'0'),module:ncts?'NCTS':'Lojistik',status:'Hazırlanıyor',route:ncts?values.departure+' → '+values.arrival:values.country,sale:undefined,paid:0,weight:Number(values.weight),packages:Number(values.packages)});sessionStorage.setItem(key,JSON.stringify(records));}nav(page);const message=el('p','Demo kaydı eklendi.');message.setAttribute('role','status');screen.prepend(message);};card().append(form);
}
const back=document.querySelector('header a');back.href=moduleLink('home');back.textContent='Ana Sayfa';
if(pages.length){pages.forEach(page=>menu.append(button(page,()=>nav(page))));nav(pages[0]);}else home();

</script></body></html>
